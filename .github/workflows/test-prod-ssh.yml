
      - name: Test Network Connectivity
        shell: powershell
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROD_HOST)) {
              Write-Error "PROD_HOST is empty. Check the production environment secret."
              exit 1
          }

          Write-Host "Testing connection to $env:PROD_HOST on port 22..."

          $connection = Test-NetConnection `
              -ComputerName $env:PROD_HOST `
              -Port 22 `
              -WarningAction SilentlyContinue

          if ($connection.TcpTestSucceeded) {
              Write-Host "Port 22 is reachable."
          } else {
              Write-Error "Port 22 is not reachable from this computer."
              exit 1
          }
