
name: Deploy MySTAFF to Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystaff-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # Only allow deployments from main.
    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Prepare SSH
        shell: bash
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_KEY" \
            > "$HOME/.ssh/mystaff_deploy"

          printf '%s\n' "$PROD_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/mystaff_deploy"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify SSH connection
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/mystaff_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            'echo "SSH connection successful"'

      - name: Run production deployment
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/mystaff_deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            'bash "$HOME/web/mystaff.kdh.moh.gov.my/public_html/deploy.sh"'
