
name: Deploy MySTAFF to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystaff-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, Windows, X64]
    environment: production

defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass {0}

      steps:
      - name: Validate production secrets
        shell: powershell -ExecutionPolicy Bypass {0}
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          $required = @(
            "PROD_HOST",
            "PROD_USER",
            "PROD_SSH_KEY",
            "PROD_KNOWN_HOSTS"
          )

          foreach ($name in $required) {
            $value = [Environment]::GetEnvironmentVariable($name)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "Missing required production secret: $name"
            }
          }

          Write-Host "Production secrets are configured."

      - name: Configure SSH
        shell: powershell
        env:
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          $sshDir = Join-Path $HOME ".ssh"
          New-Item -ItemType Directory -Force -Path $sshDir | Out-Null

          $keyPath = Join-Path $sshDir "mystaff_deploy"
          $knownHostsPath = Join-Path $sshDir "known_hosts"

          [System.IO.File]::WriteAllText(
            $keyPath,
            $env:PROD_SSH_KEY.Trim() + "`n",
            [System.Text.Encoding]::ASCII
          )

          [System.IO.File]::WriteAllText(
            $knownHostsPath,
            $env:PROD_KNOWN_HOSTS.Trim() + "`n",
            [System.Text.Encoding]::ASCII
          )

          Write-Host "SSH files configured."

      - name: Test production SSH
        shell: powershell
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          $keyPath = Join-Path $HOME ".ssh\mystaff_deploy"
          $knownHostsPath = Join-Path $HOME ".ssh\known_hosts"

          ssh -i $keyPath `
            -o BatchMode=yes `
            -o IdentitiesOnly=yes `
            -o ConnectTimeout=15 `
            -o StrictHostKeyChecking=yes `
            -o "UserKnownHostsFile=$knownHostsPath" `
            "$($env:PROD_USER)@$($env:PROD_HOST)" `
            "echo 'Production SSH connection successful'"

          if ($LASTEXITCODE -ne 0) {
            throw "Could not connect to production through SSH."
          }

      - name: Deploy MySTAFF
        shell: powershell
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
        run: |
          Write-Host "Starting MySTAFF production deployment..."

          ssh -i (Join-Path $HOME ".ssh\mystaff_deploy") `
            -o BatchMode=yes `
            -o IdentitiesOnly=yes `
            -o ConnectTimeout=15 `
            -o StrictHostKeyChecking=yes `
            -o "UserKnownHostsFile=$(Join-Path $HOME '.ssh\known_hosts')" `
            "$($env:PROD_USER)@$($env:PROD_HOST)" `
            "cd ~/web/mystaff.kdh.moh.gov.my/public_html && bash deploy.sh"

          if ($LASTEXITCODE -ne 0) {
            throw "MySTAFF deployment failed. Check the SSH output above."
          }

          Write-Host "MySTAFF deployment completed successfully."
