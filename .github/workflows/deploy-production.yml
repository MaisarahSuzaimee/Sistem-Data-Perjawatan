name: Deploy MySTAFF to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mystaff-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Validate deploy token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "Missing required production secret: DEPLOY_TOKEN"
            exit 1
          fi

          echo "Deploy token is configured."

      - name: Trigger production deploy
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          echo "Starting MySTAFF production deployment via deploy.php..."

          set +e
          response="$(curl -sS --max-time 360 \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            -H "Accept: text/plain" \
            -w "\n__HTTP_STATUS__:%{http_code}" \
            https://mystaff.kdh.moh.gov.my/deploy.php)"
          curl_exit=$?
          set -e

          status="$(printf '%s\n' "$response" | sed -n 's/^__HTTP_STATUS__://p' | tail -n 1)"
          body="$(printf '%s\n' "$response" | sed '/^__HTTP_STATUS__:/d')"

          echo "$body"
          echo
          echo "HTTP status: ${status:-unknown}"

          if [ "$curl_exit" -ne 0 ]; then
            echo "curl failed with exit code ${curl_exit}"
            exit "$curl_exit"
          fi

          if [ "$status" != "200" ]; then
            echo "Production deploy.php returned HTTP ${status}"
            exit 1
          fi

          echo "MySTAFF deployment completed successfully."
